name: Publish

# This file lives in the monorepo under `sdk/appwin-android/` and runs only in
# the published mirror (same travel mechanism as ci.yml). It fires on the
# release tag that `sdk/scripts/release.mjs --push` creates, so publishing
# needs no workstation credential.
#
# Four repository secrets (the vanniktech plugin reads them as Gradle
# properties through the ORG_GRADLE_PROJECT_ prefix):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD - Central Portal user
#     token (central.sonatype.com > Account > Generate User Token)
#   SIGNING_KEY - ASCII-armored GPG private key (gpg --export-secret-keys
#     --armor <id>), SIGNING_KEY_PASSWORD - its passphrase

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}

jobs:
  # Same validation as a push to main: publishing waits for green.
  checks:
    uses: ./.github/workflows/ci.yml
  maven:
    needs: checks
    name: Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # publishToMavenCentral uploads and releases the staging bundle; the
      # configuration cache is off because the publish tasks are not
      # compatible with it.
      - name: Publish all modules
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
