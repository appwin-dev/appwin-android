name: CI

# Written in the monorepo under `sdk/appwin-android/`, run in the published
# mirror: GitHub reads workflows from the repository root alone. See the note in
# the iOS mirror's workflow for why it is authored here and not there.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8 accepts 17 to 21 and nothing above: the version is pinned here
          # rather than left to the runner, which raises it without warning.
          java-version: '21'
          cache: gradle

      # The runner image ships the Android SDK and exports ANDROID_HOME, which
      # is what Gradle falls back to: `local.properties` is a developer machine
      # file and the release script keeps it out of the mirror.
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Assemble release
        run: ./gradlew --console=plain assembleRelease
